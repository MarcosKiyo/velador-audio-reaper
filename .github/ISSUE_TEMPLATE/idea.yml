name: An idea or a request / Una idea o un pedido
description: What would you like it to do? (English or Spanish)
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to be able to do / Qué te gustaría poder hacer
      description: Say it the way you'd ask the panel.
    validations:
      required: true
  - type: input
    id: daw
    attributes:
      label: Which DAW do you use / Qué programa usás
      description: REAPER, Ableton, Logic, Pro Tools, other.
