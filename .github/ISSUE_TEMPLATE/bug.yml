name: Something broke / Algo no anda
description: Tell me what happened (English or Spanish)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Please don't paste client names or personal data. / Gracias por avisar. No pegues nombres de clientes ni datos personales.
  - type: textarea
    id: que
    attributes:
      label: What you did and what happened / Qué hiciste y qué pasó
      description: The request you typed in the panel and what it answered or did.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versions / Versiones
      description: Mac (chip), REAPER version and Claude Code version (`claude --version`).
  - type: textarea
    id: extra
    attributes:
      label: Anything else / Algo más
      description: Screenshots, error messages, what you expected.
