name: Share your example / Contame tu ejemplo
description: Show me how you used it (English or Spanish)
labels: ["ejemplo"]
body:
  - type: textarea
    id: pedido
    attributes:
      label: What you asked for / Qué le pediste
    validations:
      required: true
  - type: textarea
    id: resultado
    attributes:
      label: What happened, how long it took and what helped / Qué pasó, cuánto tardó y qué te sirvió
  - type: checkboxes
    id: permiso
    attributes:
      label: Permission / Permiso
      options:
        - label: If it helps, you may mention my example (without my name). / Si sirve, pueden mencionar mi ejemplo (sin mi nombre).
